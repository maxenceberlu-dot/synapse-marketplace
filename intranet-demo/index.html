<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pulse Intranet · Démonstration</title>
<meta name="description" content="Découvrez à quoi ressemble l'intranet Pulse : accueil personnalisé, actualités ciblées, annuaire et porte d'entrée vers vos applications.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf8f4; --bg-subtle:#f5efe6; --bg-card:#ffffff;
  --border:#e4dde8; --border-strong:#d8cee0;
  --text-primary:#17152e; --text-secondary:#4a4760; --text-tertiary:#8a86a0;
  --accent-1:#d81f78; --accent-2:#6a2a95;
  --gradient-brand:linear-gradient(120deg,#d81f78,#6a2a95);
  --gradient-text:linear-gradient(100deg,#d81f78 10%,#8c2a9c 55%,#4e2a8e 95%);
  --shadow-sm:0 1px 2px rgba(40,25,50,0.06);
  --font:'Public Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-display:'Newsreader',Georgia,serif;
  --transition:all .25s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--text-primary);display:flex;flex-direction:column;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}
.gtext{font-style:italic;background:var(--gradient-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

.microsite-bar{position:sticky;top:0;z-index:200;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);flex-shrink:0;}
.microsite-bar-inner{max-width:1160px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
.ms-logo{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:800;font-size:1.05rem;color:var(--text-primary);}
.ms-logo-mark{width:30px;height:30px;border-radius:9px;background:var(--gradient-brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ms-logo-mark svg{width:16px;height:16px;}
.ms-tabs{display:flex;gap:4px;background:var(--bg-subtle);padding:4px;border-radius:12px;border:1px solid var(--border);}
.ms-tab{padding:8px 16px;border-radius:9px;font-size:0.88rem;font-weight:600;text-decoration:none;color:var(--text-secondary);transition:var(--transition);}
.ms-tab:hover{color:var(--text-primary);}
.ms-tab-active{background:var(--bg-card);color:var(--text-primary);box-shadow:var(--shadow-sm);}
.ms-actions{display:flex;align-items:center;gap:10px;}
.lang-toggle{width:40px;height:36px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-card);color:var(--text-primary);font-weight:700;font-size:0.8rem;display:flex;align-items:center;justify-content:center;transition:var(--transition);}
.lang-toggle:hover{background:var(--bg-subtle);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 18px;border-radius:999px;font-weight:600;font-size:0.85rem;text-decoration:none;border:none;transition:var(--transition);white-space:nowrap;}
.btn-primary{background:var(--gradient-brand);color:#fff;box-shadow:0 6px 20px rgba(216,31,120,0.25);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(216,31,120,0.35);}

.demo-intro{padding:28px 24px 8px;text-align:center;flex-shrink:0;}
.demo-intro .eyebrow{display:inline-block;font-size:0.76rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent-1);margin-bottom:8px;}
.demo-intro h1{font-family:var(--font-display);font-weight:500;font-size:clamp(1.4rem,2.6vw,1.8rem);max-width:680px;margin:0 auto 10px;line-height:1.25;}
.demo-intro p{font-size:0.92rem;color:var(--text-secondary);max-width:620px;margin:0 auto;line-height:1.55;}
.demo-intro .demo-intro-cta{font-size:0.85rem;color:var(--text-tertiary);margin-top:12px;font-weight:600;}
.demo-intro .lang-note{font-size:0.78rem;color:var(--text-tertiary);margin-top:6px;font-style:italic;}
.demo-frame-wrap{flex:1;padding:16px 24px 24px;min-height:0;}
.demo-frame-shell{max-width:1280px;height:100%;margin:0 auto;border-radius:16px;border:1px solid var(--border-strong);box-shadow:0 20px 60px rgba(40,25,50,0.12);overflow:hidden;background:#fff;display:flex;flex-direction:column;}
.demo-frame-chrome{height:38px;background:var(--bg-subtle);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 14px;flex-shrink:0;}
.demo-frame-chrome span{width:10px;height:10px;border-radius:50%;background:var(--border-strong);}
.demo-frame-wrap iframe{flex:1;width:100%;border:none;display:block;background:#fff;}

@media (max-width:640px){
  .microsite-bar-inner{padding:0 14px;gap:8px;}
  .ms-logo span:last-child{display:none;}
  .ms-tabs{gap:2px;padding:3px;}
  .ms-tab{padding:7px 9px;font-size:0.74rem;white-space:nowrap;}
  .microsite-bar .btn{display:none;}
  .demo-intro{padding:16px 16px 2px;}
  .demo-frame-wrap{padding:12px;}
  .demo-frame-shell{border-radius:12px;}
}
</style>
</head>
<body>

<header class="microsite-bar">
  <div class="microsite-bar-inner">
    <a href="index.html" class="ms-logo">
      <span class="ms-logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5h4l1.5-4 3 8 1.5-4h6"/></svg></span>
      <span>Pulse</span>
    </a>
    <nav class="ms-tabs" aria-label="Navigation du site de démonstration">
      <a href="index.html" class="ms-tab ms-tab-active" aria-current="page" data-i18n="navDemo">Démonstration</a>
      <a href="pricing.html" class="ms-tab" data-i18n="navPricing">Tarifs &amp; offres</a>
      <a href="widgets.html" class="ms-tab" data-i18n="navWidgets">Widgets</a>
    </nav>
    <div class="ms-actions">
      <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language / Changer de langue">EN</button>
      <a href="pricing.html" class="btn btn-primary" data-i18n="navCta">Voir les tarifs</a>
    </div>
  </div>
</header>

<div class="demo-intro">
  <span class="eyebrow">Pulse</span>
  <h1 data-i18n="pitchTitle">Un acteur majeur de l'intranet et de l'engagement collaborateur, <span class="gtext" data-i18n-inner="pitchAccent">pensé pour être le plus personnalisable du marché</span></h1>
  <p class="demo-intro-cta" data-i18n="pitchCta">Voici à quoi ressemble concrètement votre futur intranet :</p>
  <p class="lang-note" data-i18n="langNote"></p>
</div>

<div class="demo-frame-wrap">
  <div class="demo-frame-shell">
    <div class="demo-frame-chrome"><span></span><span></span><span></span></div>
    <iframe src="demo.html" title="Démonstration interactive de l'intranet Pulse" loading="eager"></iframe>
  </div>
</div>

<script>
(function(){
  var UI_STRINGS = {
    fr: {
      navDemo: 'Démonstration', navPricing: 'Tarifs & offres', navWidgets: 'Widgets', navCta: 'Voir les tarifs',
      pitchAccent: 'pensé pour être le plus personnalisable du marché',
      pitchCta: 'Voici à quoi ressemble concrètement votre futur intranet :',
      langNote: ''
    },
    en: {
      navDemo: 'Demo', navPricing: 'Pricing & Plans', navWidgets: 'Widgets', navCta: 'View pricing',
      pitchAccent: 'built to be the most customisable on the market',
      pitchCta: "Here's what your future intranet actually looks like:",
      langNote: 'Note: the interactive preview below is currently available in French only.'
    }
  };
  var pitchTitlePrefix = { fr: "Un acteur majeur de l'intranet et de l'engagement collaborateur, ", en: 'A major player in intranets and employee engagement, ' };

  function applyLang(lang){
    var t = UI_STRINGS[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if(key === 'pitchTitle'){
        var accentEl = el.querySelector('[data-i18n-inner="pitchAccent"]');
        el.firstChild.textContent = pitchTitlePrefix[lang];
        if(accentEl) accentEl.textContent = t.pitchAccent;
      } else if(t[key] !== undefined){
        el.textContent = t[key];
      }
    });
    document.getElementById('langToggle').textContent = lang === 'fr' ? 'EN' : 'FR';
    try { localStorage.setItem('pulse-microsite-lang', lang); } catch(e) {}
  }

  var toggle = document.getElementById('langToggle');
  var current = 'fr';
  try { current = localStorage.getItem('pulse-microsite-lang') || 'fr'; } catch(e) {}
  applyLang(current);
  toggle.addEventListener('click', function(){
    current = current === 'fr' ? 'en' : 'fr';
    applyLang(current);
  });
})();
</script>
</body>
</html>
